## ── Twenty CRM Storage ───────────────────────────────────────────────────────
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: truenorth-twenty-pvc
  namespace: truenorth-demo
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---
## ── Twenty Server ────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: truenorth-twenty
  namespace: truenorth-demo
  labels:
    app: truenorth-twenty
    project: truenorth-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: truenorth-twenty
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: truenorth-twenty
        project: truenorth-demo
    spec:
      containers:
        - name: twenty
          image: twentycrm/twenty:latest
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: truenorth-env
                  key: DATABASE_URL
            - name: REDIS_URL
              value: "redis://truenorth-redis.truenorth-demo.svc.cluster.local:6379"
            - name: APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: truenorth-env
                  key: TWENTY_APP_SECRET
            - name: SERVER_URL
              valueFrom:
                secretKeyRef:
                  name: truenorth-env
                  key: TWENTY_SERVER_URL
            - name: FRONT_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: truenorth-env
                  key: TWENTY_SERVER_URL
            - name: STORAGE_TYPE
              value: "local"
            - name: STORAGE_LOCAL_PATH
              value: "/app/packages/twenty-server/.local-storage"
            - name: MESSAGE_QUEUE_TYPE
              value: "bull-mq"
            # SSO — Authentik OIDC
            - name: AUTH_SSO_ENABLED
              valueFrom:
                secretKeyRef:
                  name: truenorth-env
                  key: AUTH_SSO_ENABLED
            - name: AUTH_SSO_OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: truenorth-env
                  key: AUTH_SSO_OIDC_CLIENT_ID
            - name: AUTH_SSO_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: truenorth-env
                  key: AUTH_SSO_OIDC_CLIENT_SECRET
            - name: AUTH_SSO_OIDC_ISSUER
              valueFrom:
                secretKeyRef:
                  name: truenorth-env
                  key: AUTH_SSO_OIDC_ISSUER
            # psql env vars — used by Twenty's startup h