## ── Hermes Agent Storage ─────────────────────────────────────────────────────
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: truenorth-hermes-pvc
  namespace: truenorth-demo
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---
## ── Hermes Agent Deployment ──────────────────────────────────────────────────
# Image: nousresearch/hermes-agent (Docker Hub)
# Port:  8642 (OpenAI-compatible API + /health endpoint)
# Docs:  https://hermes-agent.nousresearch.com/docs/user-guide/docker
apiVersion: apps/v1
kind: Deployment
metadata:
  name: truenorth-hermes
  namespace: truenorth-demo
  labels:
    app: truenorth-hermes
    project: truenorth-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: truenorth-hermes
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: truenorth-hermes
        project: truenorth-demo
    spec:
      containers:
        - name: hermes
          image: nousresearch/hermes-agent:latest
          args: ["gateway", "run"]
          ports:
            - containerPort: 8642
          env:
            - name: API_SERVER_ENABLED
              value: "true"
            - name: API_SERVER_HOST
              value: "0.0.0.0"
            - name: API_SERVER_PORT
              value: "8642"
            - name: API_SERVER_KEY
              valueFrom:
                secretKeyRef:
                  name: truenorth-env
                  key: HERMES_API_KEY
            - name: API_SERVER_CORS_ORIGINS
              value: "https://truenorth.madeformeai.com"
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: truenorth-env
                  key: HERMES_OPENROUTER_KEY
