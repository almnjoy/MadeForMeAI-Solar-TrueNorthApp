apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: truenorth-postgres-pvc
  namespace: truenorth-demo
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: truenorth-postgres
  namespace: truenorth-demo
  labels:
    app: truenorth-postgres
    project: truenorth-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: truenorth-postgres
  strategy:
    type: Recreate   # Recreate required — RWO PVC can't attach to 2 pods
  template:
    metadata:
      labels:
        app: truenorth-postgres
        project: truenorth-demo
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: truenorth-env
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: truenorth-env
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: truenorth-env
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRES_USER)", "-d", "$(POSTGRES_DB)"]
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: truenorth-postgres-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: truenorth-postgres
  namespace: truenorth-demo
  labels:
    app: truenorth-postgres
    project: truenorth-demo
spec:
  selector:
    app: truenorth-postgres
  ports:
    - port: 5432
      targetPort: 5432
  clusterIP: None   # Headless — matches DATABASE_URL in secrets.yaml using FQDN
