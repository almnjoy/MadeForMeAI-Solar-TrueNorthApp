# TrueNorth Demo — Master Secret
# Fill in all values before applying.
# Apply with: kubectl apply -f secrets.yaml -n truenorth-demo
#
# NOTE: stringData accepts plain text — K8s encodes to base64 automatically on apply.
# DO NOT commit this file with real values filled in.

apiVersion: v1
kind: Secret
metadata:
  name: truenorth-env
  namespace: truenorth-demo
type: Opaque
stringData:

  # ── Authentik ────────────────────────────────────────────────────
  AUTHENTIK_CLIENT_ID: "FILL_IN"
  AUTHENTIK_CLIENT_SECRET: "FILL_IN"
  # Full issuer URL — Authentik admin → Providers → truenorth-provider → OpenID Configuration
  AUTHENTIK_ISSUER_URL: "https://identity.madeformeai.com/application/o/truenorth/"
  AUTHENTIK_REDIRECT_URI: "https://truenorth.madeformeai.com/callback"

  # ── Postgres ─────────────────────────────────────────────────────
  POSTGRES_DB: "truenorth"
  POSTGRES_USER: "truenorth"
  POSTGRES_PASSWORD: "FILL_IN"
  # Internal K8s service URL — used by Twenty CRM and any other consumers
  DATABASE_URL: "postgresql://truenorth:FILL_IN@truenorth-postgres.truenorth-demo.svc.cluster.local:5432/truenorth"

  # ── Twenty CRM ───────────────────────────────────────────────────
  TWENTY_APP_SECRET: "FILL_IN"                  # openssl rand -hex 32
  TWENTY_SERVER_URL: "https://crm.truenorth.madeformeai.com"
  TWENTY_STORAGE_TYPE: "local"

  # ── Hermes ───────────────────────────────────────────────────────
  HERMES_OPENROUTER_KEY: "FILL_IN"
  # Discord bot tokens — one per agent profile
  HERMES_BOT_TOKEN_DOC: "FILL_IN"
  HERMES_BOT_TOKEN_SUPPORT: "FILL_IN"
  HERMES_BOT_TOKEN_SALES: "FILL_IN"
  HERMES_BOT_TOKEN_LEAD: "FILL_IN"
  HERMES_BOT_TOKEN_CONTROLLER: "FILL_IN"

  # ── OpenClaw ─────────────────────────────────────────────────────
  OPENCLAW_OPENROUTER_KEY: "FILL_IN"
  OPENCLAW_GATEWAY_TOKEN: "FILL_IN"

  # ── Frontend ─────────────────────────────────────────────────────
  VITE_APP_NAME: "TrueNorth Solar AI"
  VITE_AUTHENTIK_CLIENT_ID: "FILL_IN"
  VITE_AUTHENTIK_ISSUER_URL: "https://identity.madeformeai.com/application/o/truenorth/"
  VITE_TWENTY_API_URL: "https://crm.truenorth.madeformeai.com"

  # ── Branding (used by frontend + future white-label swap) ────────
  BRAND_NAME: "TrueNorth Solar AI"
  BRAND_COLOR_PRIMARY: "#F59E0B"
  BRAND_COLOR_ACCENT: "#10B981"
