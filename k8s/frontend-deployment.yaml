apiVersion: apps/v1
kind: Deployment
metadata:
  name: truenorth-frontend
  namespace: truenorth-demo
  labels:
    app: truenorth-frontend
    project: truenorth-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: truenorth-frontend
  template:
    metadata:
      labels:
        app: truenorth-frontend
        project: truenorth-demo
    spec:
      containers:
        - name: frontend
          image: ghcr.io/almnjoy/truenorth-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30

---
apiVersion: v1
kind: Service
metadata:
  name: truenorth-frontend
  namespace: truenorth-demo
  labels:
    app: truenorth-frontend
    project: truenorth-demo
spec:
  selector:
    app: truenorth-frontend
  ports:
    - port: 80
      targetPort: 80
