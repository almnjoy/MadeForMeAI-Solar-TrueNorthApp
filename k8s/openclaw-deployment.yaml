## ── OpenClaw Deployment ───────────────────────────────────────────────────────
# Image: ghcr.io/openclaw/openclaw:2026.5.20
# Port:  18789
# Auth:  trusted-proxy via Authentik (X-authentik-email header)
# Config: mounted from ConfigMap at /home/node/.openclaw/config.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: truenorth-openclaw
  namespace: truenorth-demo
  labels:
    app: truenorth-openclaw
    project: truenorth-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: truenorth-openclaw
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: truenorth-openclaw
        project: truenorth-demo
    spec:
      initContainers:
        - name: seed-config
          image: busybox
          command:
            - sh
            - -c
            - |
              if [ ! -f /data/openclaw.json ]; then
                cp /config/openclaw.json /data/openclaw.json
                echo "Seeded openclaw.json"
              else
                echo "openclaw.json already exists, skipping seed"
              fi
          volumeMounts:
            - name: openclaw-data
              mountPath: /data
            - name: openclaw-config
              mountPath: /config
      containers:
        - name: openclaw
          image: ghcr.io/openclaw/openclaw:2026.5.20
          ports:
            - containerPort: 18789
          env:
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: truenorth-env
                  key: OPENCLAW_OPENROUTER_KEY
          volumeMounts:
            - name: openclaw-data
              mountPath: /home/node/.openclaw
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          readinessProbe:
            tcpSocket:
              port: 18789
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            tcpSocket:
              port: 18789
            initialDelaySeconds: 40
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        - name: openclaw-data
          persistentVolumeClaim:
            claimName: truenorth-openclaw-pvc
        - name: openclaw-config
          configMap:
            name: truenorth-openclaw-config

---
## ── OpenClaw Service ─────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: truenorth-openclaw
  namespace: truenorth-demo
  labels:
    app: truenorth-openclaw
    project: truenorth-demo
spec:
  selector:
    app: truenorth-openclaw
  ports:
    - port: 18789
      targetPort: 18789

---
## ── OpenClaw Ingress ─────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: truenorth-openclaw-ingress
  namespace: truenorth-demo
  labels:
    project: truenorth-demo
  annotations:
    kubernetes.io/ingress.class: traefik
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  tls:
    - hosts:
        - truenorth-openclaw.madeformeai.com
  rules:
    - host: truenorth-openclaw.madeformeai.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: truenorth-openclaw
                port:
                  number: 18789
