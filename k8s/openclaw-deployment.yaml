      "session": {
        "reset": {
          "mode": "daily",
          "atHour": 4,
          "idleMinutes": 240
        }
      },
      "tools": {
        "elevated": {
          "enabled": true,
          "allowFrom": {
            "webchat": ["*"]
          }
        },
        "web": {
          "search": {
            "provider": "duckduckgo"
          },
          "fetch": {
            "enabled": true
          }
        }
      },
      "plugins": {
        "entries": {
          "openrouter": {
            "enabled": true
          },
          "duckduckgo": {
            "enabled": true
          },
          "memory-core": {
            "enabled": true
          },
          "active-memory": {
            "enabled": true
          }
        }
      },
      "skills": {
        "entries": {
          "healthcheck": {
            "enabled": false
          }
        }
      },
      "update": {
        "checkOnStart": false
      }
    }

